name: Build team-332 verification image

on:
  push:
    branches:
      - build/team-332-image
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: team332-verify
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout upstream ranxi2001/sub2api at v2.7.4
        uses: actions/checkout@v4
        with:
          repository: ranxi2001/sub2api
          ref: v2.7.4
          fetch-depth: 1

      - name: Apply team/business plan_type patch
        shell: bash
        run: |
          set -euo pipefail
          echo "" | base64 -d > /tmp/team332.patch
          git apply --verbose /tmp/team332.patch
          echo "--- patched function ---"
          grep -n "openAICodexTicketTeamPlanMarkers" backend/internal/service/openai_codex_ticket.go
          echo "--- added tests ---"
          grep -c "TestOpenAICodexTicketExpectedBlocksByPlanType" backend/internal/service/openai_codex_ticket_test.go

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/spake404/sub2api:team332-verify
            ghcr.io/spake404/sub2api:team332-56a0740
          build-args: |
            VERSION=2.7.4
            COMMIT=${{ github.sha }}
            DATE=${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
